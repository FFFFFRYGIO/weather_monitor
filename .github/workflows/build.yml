name: build
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start PostgreSQL from docker-compose.yml
        run: docker compose up -d db
      - name: Wait for DB and init scripts
        run: |
          for i in $(seq 1 60); do
            docker compose exec -T db pg_isready -U admin && break; sleep 2
          done
          sleep 3
          docker compose logs db | tail -30
          docker compose exec -T db psql -U admin -c '\l'
          docker compose exec -T db psql -U admin -c '\dt *.*' | grep -v pg_catalog | grep -v information_schema | head -30
